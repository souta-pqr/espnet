# network architecture
# encoder related
encoder: contextual_block_conformer    # contextual_block_conformer is the core of streaming conformer
encoder_conf:
    output_size: 256    # dimension of attention
    attention_heads: 4
    linear_units: 2048  # the number of units of position-wise feed forward
    num_blocks: 12     # the number of encoder blocks
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.0
    input_layer: conv2d # encoder architecture type
    normalize_before: true
    activation_type: swish
    macaron_style: true
    use_cnn_module: true
    cnn_module_kernel: 15
    block_size: 18      # streaming configuration
    hop_size: 3         # streaming configuration
    look_ahead:  3      # streaming configuration
    init_average: true  # streaming configuration
    ctx_pos_enc: true   # streaming configuration

# decoder related - changed for disfluency detection
decoder: disfluency_transformer
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.0
    src_attention_dropout_rate: 0.0
    # Disfluency-specific settings
    disfluency_dim: 4

# hybrid CTC/attention
model_conf:
    ctc_weight: 0.0
    report_cer: True
    report_wer: True
    # lsm_weight: 0.1     # label smoothing option
    length_normalized_loss: false
    

# seed setting
seed: 30

# minibatch related
# batch_type: folded
# batch_size: 128    #　GPUに余裕があるなら変更してもよいかも
# batch_size: 150 # crash silver9
#valid_batch_size: 1
# optimization related
batch_type: numel
batch_bins: 800000
accum_grad: 8
grad_clip: 5
patience: 10
max_epoch: 50
# val_scheduler_criterion:
#     - valid
#     - acc
best_model_criterion:
-   - valid
    - acc
    - max
# early_stopping_criterion:
#     - valid
#     - cer_ctc
#     - min
keep_nbest_models: 10

# NoamLR is deprecated. Use WarmupLR.
# The following is equivalent setting for NoamLR:
#
#    optim: adam
#    optim_conf:
#        lr: 10.
#    scheduler: noamlr
#    scheduler_conf:
#        model_size: 256
#        warmup_steps: 25000
#
optim: adam
optim_conf:
    lr: 0.002
scheduler: warmuplr     # pytorch v1.1.0+ required
scheduler_conf:
    warmup_steps: 25000
num_att_plot: 0
specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 30
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_range:
    - 0
    - 40
    num_time_mask: 2